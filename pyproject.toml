[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yahoo-fantasy-waiver-assistant"
version = "0.1.0"
description = "Personal read-only Yahoo Fantasy Football waiver analytics assistant"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "cryptography>=42,<47"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
waiver-assistant = "yahoo_waiver_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
